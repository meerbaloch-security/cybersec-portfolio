name: project-06 attack-paths tests

on:
  push:
    paths: ["project-06-attack-path-analyzer/**", ".github/workflows/project-06-tests.yml"]
  pull_request:
    paths: ["project-06-attack-path-analyzer/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: project-06-attack-path-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Generate the report from the sample environment
        run: python attack_paths.py samples/acme_environment.json --html /tmp/report.html
