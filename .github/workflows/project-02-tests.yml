name: project-02 phish-analyzer tests

on:
  push:
    paths: ["project-02-phishing-email-analyzer/**", ".github/workflows/project-02-tests.yml"]
  pull_request:
    paths: ["project-02-phishing-email-analyzer/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: project-02-phishing-email-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Demo run on samples
        run: python phish_analyzer.py samples/*.eml
