name: project-04 iam-analyzer tests

on:
  push:
    paths: ["project-04-iam-policy-analyzer/**", ".github/workflows/project-04-tests.yml"]
  pull_request:
    paths: ["project-04-iam-policy-analyzer/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: project-04-iam-policy-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Demo run on the sample account
        run: python iam_analyzer.py samples/account_authorization_details.json
