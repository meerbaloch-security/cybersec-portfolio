title: Member Added to a Privileged Group
name: privileged_group_member_added
id: f33a09c5-8a12-48f2-9d4a-47795b92fe17
status: test
description: Detects an account being added to the local Administrators group or to Domain/Enterprise Admins (Security events 4728, 4732, 4756).
author: Project 07 (SOC Investigation Simulator)
date: 2026-11-03
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: windows
    service: security
detection:
    selection_event:
        EventID:
            - 4728
            - 4732
            - 4756
    selection_group:
        TargetUserName:
            - 'Administrators'
            - 'Domain Admins'
            - 'Enterprise Admins'
    condition: all of selection_*
falsepositives:
    - Approved access requests (check for a matching change ticket)
level: high
risk_score: 50
