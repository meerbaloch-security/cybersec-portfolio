title: Credential Hive Export with reg.exe
name: reg_save_sensitive_hive
id: 780eb550-d159-456e-9c67-f833a3888415
status: test
description: Detects reg.exe saving or exporting the SAM, SYSTEM or SECURITY hives, which contain local password hashes and secrets.
author: Project 07 (SOC Investigation Simulator)
date: 2026-11-03
tags:
    - attack.credential-access
    - attack.t1003.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith: '\reg.exe'
    selection_action:
        CommandLine|contains:
            - ' save '
            - ' export '
    selection_hive:
        CommandLine|contains:
            - 'hklm\sam'
            - 'hklm\system'
            - 'hklm\security'
            - 'hkey_local_machine\sam'
            - 'hkey_local_machine\system'
            - 'hkey_local_machine\security'
    condition: all of selection_*
falsepositives:
    - Backup software that exports registry hives (confirm the parent process)
level: high
risk_score: 70
