title: PowerShell Launched with an Encoded Command
name: powershell_encoded_command
id: 459559ba-1051-4227-af59-3950e59205ec
status: test
description: Detects powershell.exe started with -EncodedCommand (or its short forms). Encoding hides the script from casual review; analysts should decode it.
author: Project 07 (SOC Investigation Simulator)
date: 2026-11-03
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense-evasion
    - attack.t1027
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_flag:
        CommandLine|contains|windash:
            - ' -enc '
            - ' -encodedcommand '
            - ' -ec '
            - ' -e '
    condition: all of selection_*
falsepositives:
    - Management tools (SCCM, Intune, RMM agents) that pass encoded scripts
level: high
risk_score: 40
